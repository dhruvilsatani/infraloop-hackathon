<header class="site-header">
  <div class="container nav">
    <a routerLink="/" class="brand" aria-label="InfraLoop home">
      <img class="brand-logo" src="/assets/infraloop-logo.png" alt="" />
    </a>
    <nav class="nav-links" aria-label="Main">
      @if (onLanding()) {
        <a routerLink="/" fragment="how">How it works</a>
      }
      <a href="#" (click)="openExample($event)">Example report</a>
      <a routerLink="/" fragment="roadmap">Roadmap</a>
    </nav>
    @if (onLanding()) {
      <a class="btn btn-primary" routerLink="/scan">Get my report</a>
    } @else {
      <a class="btn btn-outline" routerLink="/scan" (click)="newScan($event)">New scan</a>
    }
  </div>
</header>
