<canvas #canvas id="webgl-bg" aria-hidden="true"></canvas>
<div class="bg-glow-container" aria-hidden="true"><div class="glow-top"></div><div class="glow-bottom"></div></div>
<div class="globe-media-layer" aria-hidden="true">
  @if (!stillMissing()) {
    <img src="/assets/globe.jpg" alt="" class="globe-still" (error)="stillMissing.set(true)" />
  }
  <video class="globe-video" [class.ready]="videoReady()" autoplay loop muted playsinline poster="/assets/globe.jpg" (canplay)="videoReady.set(true)">
    <source src="/assets/globe.mp4" type="video/mp4" />
  </video>
</div>
