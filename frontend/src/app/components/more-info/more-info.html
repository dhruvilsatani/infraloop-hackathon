<button
  type="button"
  class="more-info-toggle"
  [attr.aria-expanded]="expanded()"
  [attr.aria-controls]="panelId"
  (click)="toggle()">
  <span>{{ expanded() ? 'Show less info' : 'Show more info' }}</span>
  @if (title()) {
    <span class="more-info-title">{{ title() }}</span>
  }
  <svg class="more-info-chevron" [class.expanded]="expanded()" viewBox="0 0 16 16" aria-hidden="true">
    <path d="m3.5 6 4.5 4 4.5-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
  </svg>
</button>
<div
  class="more-info-panel"
  [class.expanded]="expanded()"
  [id]="panelId"
  [attr.aria-hidden]="!expanded()"
  [attr.inert]="expanded() ? null : ''">
  <div class="more-info-inner">
    <ng-content />
  </div>
</div>
