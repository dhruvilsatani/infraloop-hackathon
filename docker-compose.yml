# One command starts everything: `docker compose up --build`
#   Frontend (Angular): http://localhost:4200
#   Backend  (FastAPI): http://localhost:8000
# Optional settings (LLM_BASE_URL, LLM_API_KEY, LLM_MODEL, INFRALOOP_ACCESS_CODE) go in a .env file next to this file.
services:
  backend:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false

  frontend:
    build: ./frontend
    ports:
      - "4200:4200"
    environment:
      BACKEND_URL: http://backend:8000
    volumes:
      - ./frontend:/app
      # keeps the container's node_modules separate from the host folder (Windows and macOS need different binaries)
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

volumes:
  frontend_node_modules:
