# One command starts everything: `docker compose up --build`
#   Frontend (Angular): http://localhost:4200
#   Backend  (FastAPI): http://localhost:8000
# Optional settings (LLM_BASE_URL, LLM_API_KEY, LLM_MODEL, INFRALOOP_ACCESS_CODE) go in a .env file next to this file.
services:
  backend:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      # Inside the container "localhost" is the container itself, so a model gateway running on your computer
      # (OmniRoute, Ollama, ...) is reached through host.docker.internal. Set LLM_BASE_URL in .env to use another address.
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:20128/v1}
    extra_hosts:
      # makes host.docker.internal work on Linux too (Docker Desktop on macOS and Windows already has it)
      - "host.docker.internal:host-gateway"

  frontend:
    build: ./frontend
    ports:
      - "4200:4200"
    environment:
      BACKEND_URL: http://backend:8000
    volumes:
      - ./frontend:/app
      # keeps the container's node_modules separate from the host folder (Windows and macOS need different binaries)
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

volumes:
  frontend_node_modules:
